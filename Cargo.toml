[workspace]
members = ["mecha-manifest", "mecha-factory-publish", "mecha-factory"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ljchang/mecha-factory"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
minijinja = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = "3"
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
