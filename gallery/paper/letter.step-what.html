<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a letter of recommendation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cstyle%3Epath%7Bfill:%235d5294%7D@media(prefers-color-scheme:dark)%7Bpath%7Bfill:%23b5abfc%7D%7D%3C/style%3E%3Cpath%20d='M0%200h24l8%2010%208-10h24v20H0z'/%3E%3Cpath%20d='M0%2024h16v16H0zM48%2024h16v16H48zM0%2044h16v20H0zM48%2044h16v20H48z'/%3E%3Cpath%20d='M16%2044v20h12zM48%2044v20H36z'/%3E%3Cpath%20d='M20%2028h24v8H20z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="form.css">
</head>
<body>
<header class="site"><a class="mark" href="/" aria-label="mecha"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 54" width="28" height="24" fill="currentColor" role="img" aria-label="mecha"><path d="M0 0h24l7.5 8.5L39 0h24v16H0z"></path><path d="M0 20h14v15H0zM49 20h14v15H49zM0 39h14v15H0zM49 39h14v15H49z"></path><path d="M14 39v15h13.24zM49 39v15H35.76z"></path><path d="M21 24h21v7H21z"></path></svg></a></header>
<main>
<h1>Request a letter of recommendation</h1>
<p class="intro">Everything I need to write a good one, in one place.</p>
<form method="post" action="#">
<fieldset id="step-what" data-step="what"><legend>What you&#39;re applying for</legend>
<div class="field" data-field="programs">
<label for="programs">What you&#39;re applying for <span class="req" aria-hidden="true">*</span></label>
<div class="choices">
<label class="choice"><input type="checkbox" name="programs" value="phd"> A PhD programme</label>
<label class="choice"><input type="checkbox" name="programs" value="masters"> A master&#39;s programme</label>
<label class="choice"><input type="checkbox" name="programs" value="job"> A job</label>
<label class="choice"><input type="checkbox" name="programs" value="fellowship"> A fellowship or grant</label>
<label class="choice"><input type="checkbox" name="programs" value="award"> An award</label>
</div>
</div>
<div class="field" data-field="deadline">
<label for="deadline">The earliest deadline <span class="req" aria-hidden="true">*</span></label>
<p class="help" id="deadline-help">The one that comes first, not the last one.</p>
<input type="date" id="deadline" name="deadline" value="" required aria-describedby="deadline-help">
</div>
<div class="field" data-field="submission_method">
<label for="submission_method">How the letter is submitted <span class="req" aria-hidden="true">*</span></label>
<select id="submission_method" name="submission_method" required>
<option value="">Choose…</option>
<option value="portal">An online portal emails me a link</option>
<option value="email">I email it somewhere</option>
<option value="upload">I upload one file you send on</option>
</select>
</div>
<div class="field" data-field="portal_note" data-conditional="true">
<label for="portal_note">Anything I should know about the portal</label>
<p class="help" id="portal_note-help">Some of them expire the link, which is worth warning me about.</p>
<textarea id="portal_note" name="portal_note" maxlength="600" rows="6" aria-describedby="portal_note-help"></textarea>
</div>
</fieldset>
<div class="field ack" data-field="deadline_is_real">
<label for="deadline_is_real"><input type="checkbox" id="deadline_is_real" name="deadline_is_real" value="true" required> The deadline above is the real one, and I&#39;ll tell you if it moves.</label>
</div>
<button type="submit">Submit</button>
</form>
<script type="application/json" id="conditions">{"field:portal_note":{"field":"submission_method","op":"eq","value":"portal"}}</script>
<script src="form.js" defer></script>
</main>
</body>
</html>
