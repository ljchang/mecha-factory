<body>
<header class="site"><a class="mark" href="/" aria-label="mecha"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 54" width="28" height="24" fill="currentColor" role="img" aria-label="mecha"><path d="M0 0h24l7.5 8.5L39 0h24v16H0z"></path><path d="M0 20h14v15H0zM49 20h14v15H49zM0 39h14v15H0zM49 39h14v15H49z"></path><path d="M14 39v15h13.24zM49 39v15H35.76z"></path><path d="M21 24h21v7H21z"></path></svg></a></header>
<main>
<h1>A form in steps</h1>
<p class="intro">Three steps, the last of which only exists for some answers.</p>
<form method="post" action="#">
<fieldset id="step-what" data-step="what"><legend>What you&#39;re asking</legend>
<p>Enough to answer yes or no without a second exchange.</p>
<div class="field" data-field="format">
<label for="format">How will it run? <span class="req" aria-hidden="true">*</span></label>
<select id="format" name="format" required>
<option value="">Choose…</option>
<option value="in_person">In person</option>
<option value="remote">Remote</option>
<option value="hybrid">Hybrid</option>
</select>
</div>
<div class="field" data-field="summary">
<label for="summary">What are you asking for? <span class="req" aria-hidden="true">*</span></label>
<textarea id="summary" name="summary" maxlength="1200" rows="6" required></textarea>
</div>
</fieldset>
<button type="submit">Submit</button>
</form>
<script type="application/json" id="conditions">{"step:travel":{"field":"format","op":"not_in","value":["remote"]}}</script>
<script src="form.js" defer></script>
</main>
</body>
</html>
