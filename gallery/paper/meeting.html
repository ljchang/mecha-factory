<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a meeting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cstyle%3Epath%7Bfill:%235d5294%7D@media(prefers-color-scheme:dark)%7Bpath%7Bfill:%23b5abfc%7D%7D%3C/style%3E%3Cpath%20d='M0%200h24l8%2010%208-10h24v20H0z'/%3E%3Cpath%20d='M0%2024h16v16H0zM48%2024h16v16H48zM0%2044h16v20H0zM48%2044h16v20H48z'/%3E%3Cpath%20d='M16%2044v20h12zM48%2044v20H36z'/%3E%3Cpath%20d='M20%2028h24v8H20z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="form.css">
</head>
<body>
<header class="site"><a class="mark" href="/" aria-label="mecha"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 54" width="28" height="24" fill="currentColor" role="img" aria-label="mecha"><path d="M0 0h24l7.5 8.5L39 0h24v16H0z"></path><path d="M0 20h14v15H0zM49 20h14v15H49zM0 39h14v15H0zM49 39h14v15H49z"></path><path d="M14 39v15h13.24zM49 39v15H35.76z"></path><path d="M21 24h21v7H21z"></path></svg></a></header>
<main>
<h1>Request a meeting</h1>
<p class="intro">A few questions so I can answer without a thread.</p>
<form method="post" action="#">
<div class="field" data-field="requester_name">
<label for="requester_name">Your name <span class="req" aria-hidden="true">*</span></label>
<input type="text" id="requester_name" name="requester_name" maxlength="120" value="" required>
</div>
<div class="field" data-field="requester_email">
<label for="requester_email">Your email <span class="req" aria-hidden="true">*</span></label>
<p class="help" id="requester_email-help">I&#39;ll send a confirmation link here before anything reaches me.</p>
<input type="email" id="requester_email" name="requester_email" maxlength="254" value="" required aria-describedby="requester_email-help">
</div>
<div class="field" data-field="affiliation">
<label for="affiliation">Where you&#39;re writing from</label>
<input type="text" id="affiliation" name="affiliation" maxlength="160" value="">
</div>
<div class="field" data-field="purpose">
<label for="purpose">What the meeting is about <span class="req" aria-hidden="true">*</span></label>
<select id="purpose" name="purpose" required>
<option value="">Choose…</option>
<option value="advising">Advising or mentoring</option>
<option value="collaboration">A possible collaboration</option>
<option value="press">Press or an interview</option>
<option value="other">Something else</option>
</select>
</div>
<div class="field" data-field="purpose_detail" data-conditional="true">
<label for="purpose_detail">Say a little more <span class="req" aria-hidden="true">*</span></label>
<p class="help" id="purpose_detail-help">Two or three sentences is plenty.</p>
<textarea id="purpose_detail" name="purpose_detail" maxlength="1200" rows="6" required aria-describedby="purpose_detail-help"></textarea>
</div>
<div class="field" data-field="preferred_by">
<label for="preferred_by">Is there a date you need this before?</label>
<p class="help" id="preferred_by-help">Leave blank if there isn&#39;t one.</p>
<input type="date" id="preferred_by" name="preferred_by" value="" aria-describedby="preferred_by-help">
</div>
<div class="field" data-field="duration_minutes">
<label for="duration_minutes">How long you think you need</label>
<input type="number" id="duration_minutes" name="duration_minutes" step="1" min="15" max="120" value="">
</div>
<div class="field" data-field="remote_ok">
<label for="remote_ok">A video call works for me</label>
<input type="checkbox" id="remote_ok" name="remote_ok" value="true">
</div>
<div class="field ack" data-field="understands_request">
<label for="understands_request"><input type="checkbox" id="understands_request" name="understands_request" value="true" required> I understand this is a request, not a booking, and may be declined.</label>
</div>
<button type="submit">Submit</button>
</form>
<script type="application/json" id="conditions">{"field:purpose_detail":{"field":"purpose","op":"eq","value":"other"}}</script>
<script src="form.js" defer></script>
</main>
</body>
</html>
