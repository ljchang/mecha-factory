<header class="site"><a class="mark" href="/" aria-label="mecha"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 54" width="28" height="24" fill="currentColor" role="img" aria-label="mecha"><path d="M0 0h24l7.5 8.5L39 0h24v16H0z"></path><path d="M0 20h14v15H0zM49 20h14v15H49zM0 39h14v15H0zM49 39h14v15H49z"></path><path d="M14 39v15h13.24zM49 39v15H35.76z"></path><path d="M21 24h21v7H21z"></path></svg></a></header>
<main>
<h1>Invite a talk</h1>
<p class="intro">What I need to know to answer yes or no quickly.</p>
<form method="post" action="#">
<fieldset id="step-travel" data-step="travel"><legend>Travel</legend>
<div class="field" data-field="travel_covered">
<label for="travel_covered">Travel and accommodation are covered</label>
<input type="checkbox" id="travel_covered" name="travel_covered" value="true">
</div>
<div class="field" data-field="travel_notes">
<label for="travel_notes">Anything about travel I should know</label>
<p class="help" id="travel_notes-help">What&#39;s covered, how it&#39;s reimbursed, and how long you&#39;d need me on site.</p>
<textarea id="travel_notes" name="travel_notes" maxlength="1000" rows="6" aria-describedby="travel_notes-help"></textarea>
</div>
</fieldset>
<div class="field ack" data-field="understands_request">
<label for="understands_request"><input type="checkbox" id="understands_request" name="understands_request" value="true" required> I understand this is an invitation, not a confirmed booking.</label>
</div>
<button type="submit">Submit</button>
</form>
<script type="application/json" id="conditions">{"step:travel":{"field":"format","op":"not_in","value":["remote"]}}</script>
<script src="form.js" defer></script>
</main>
</body>
</html>
