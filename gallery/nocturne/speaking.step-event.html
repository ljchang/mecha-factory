<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite a talk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cstyle%3Epath%7Bfill:%235d5294%7D@media(prefers-color-scheme:dark)%7Bpath%7Bfill:%23b5abfc%7D%7D%3C/style%3E%3Cpath%20d='M0%200h24l8%2010%208-10h24v20H0z'/%3E%3Cpath%20d='M0%2024h16v16H0zM48%2024h16v16H48zM0%2044h16v20H0zM48%2044h16v20H48z'/%3E%3Cpath%20d='M16%2044v20h12zM48%2044v20H36z'/%3E%3Cpath%20d='M20%2028h24v8H20z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="form.css">
</head>
<body>
<header class="site"><a class="mark" href="/" aria-label="mecha"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 54" width="28" height="24" fill="currentColor" role="img" aria-label="mecha"><path d="M0 0h24l7.5 8.5L39 0h24v16H0z"></path><path d="M0 20h14v15H0zM49 20h14v15H49zM0 39h14v15H0zM49 39h14v15H49z"></path><path d="M14 39v15h13.24zM49 39v15H35.76z"></path><path d="M21 24h21v7H21z"></path></svg></a></header>
<main>
<h1>Invite a talk</h1>
<p class="intro">What I need to know to answer yes or no quickly.</p>
<form method="post" action="#">
<fieldset id="step-event" data-step="event"><legend>The event</legend>
<div class="field" data-field="requester_name">
<label for="requester_name">Your name <span class="req" aria-hidden="true">*</span></label>
<input type="text" id="requester_name" name="requester_name" maxlength="120" value="" required>
</div>
<div class="field" data-field="requester_email">
<label for="requester_email">Your email <span class="req" aria-hidden="true">*</span></label>
<input type="email" id="requester_email" name="requester_email" maxlength="254" value="" required>
</div>
<div class="field" data-field="organisation">
<label for="organisation">Who&#39;s hosting <span class="req" aria-hidden="true">*</span></label>
<input type="text" id="organisation" name="organisation" maxlength="160" value="" required>
</div>
<div class="field" data-field="event_name">
<label for="event_name">The event <span class="req" aria-hidden="true">*</span></label>
<input type="text" id="event_name" name="event_name" maxlength="200" value="" required>
</div>
<div class="field" data-field="event_date">
<label for="event_date">Date <span class="req" aria-hidden="true">*</span></label>
<p class="help" id="event_date-help">If it&#39;s a range, the day you&#39;d want me.</p>
<input type="date" id="event_date" name="event_date" value="" required aria-describedby="event_date-help">
</div>
<div class="field" data-field="format">
<label for="format">Format <span class="req" aria-hidden="true">*</span></label>
<select id="format" name="format" required>
<option value="">Choose…</option>
<option value="in_person">In person</option>
<option value="remote">Remote</option>
<option value="hybrid">Hybrid — in person, streamed</option>
</select>
</div>
<div class="field" data-field="talk_kind">
<label for="talk_kind">What kind of talk <span class="req" aria-hidden="true">*</span></label>
<select id="talk_kind" name="talk_kind" required>
<option value="">Choose…</option>
<option value="keynote">Keynote</option>
<option value="seminar">Department seminar</option>
<option value="panel">A panel</option>
<option value="workshop">A workshop or tutorial</option>
</select>
</div>
<div class="field" data-field="audience_size">
<label for="audience_size">Roughly how many people</label>
<input type="number" id="audience_size" name="audience_size" step="1" min="1" max="100000" value="">
</div>
</fieldset>
<div class="field ack" data-field="understands_request">
<label for="understands_request"><input type="checkbox" id="understands_request" name="understands_request" value="true" required> I understand this is an invitation, not a confirmed booking.</label>
</div>
<button type="submit">Submit</button>
</form>
<script type="application/json" id="conditions">{"step:travel":{"field":"format","op":"not_in","value":["remote"]}}</script>
<script src="form.js" defer></script>
</main>
</body>
</html>
