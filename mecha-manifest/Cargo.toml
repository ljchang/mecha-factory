[package]
name = "mecha-manifest"
description = "The versioned data contract between mecha and mecha-factory: request types, bundles, their JSON Schema, their HTML form, and the one validator both ends run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately small, and deliberately *not* including mecha-core. The contract
# is data — TOML in, JSON Schema and HTML out — so each side can parse it in its
# own language and neither has to trust the other's types.
[dependencies]
# The availability engine is part of the contract a booking instrument
# carries, and time arithmetic in an IANA zone is what it is made of. Both
# are pure — nothing here gained I/O.
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
# The content address is part of the contract: the server recomputes it over
# what arrived on the wire and has to get the publisher's answer.
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
