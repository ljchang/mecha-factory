# The public box, as it is told what to be.
#
# Nothing here is a secret, and that is deliberate: the keys mecha
# authenticates with are minted by `factory key create` and stored as Argon2id
# hashes in the ledger, so there is no field in this file where a credential
# could be put. That is the credential-isolation claim, checkable by reading
# the deployed configuration.

data_dir = "/var/lib/mecha-factory"

# Names that 301 to the gate, keeping the path: the apex and `www`, which is
# what somebody types when they were told the name of this thing rather than
# given a link. Empty means those names are answered by whatever else their DNS
# points at — a parked page, or nothing.
#
# **DNS first, this second, and verify in between.** These names get their own
# certificate (never the base one, so a redirect that is not ready cannot take
# the gate down), and it is issued over HTTP-01 — which is a plain GET on port
# 80 that has to reach *this box*. Add the record, watch it resolve here, then
# add the name to this list. The other order costs nothing but a certificate
# that cannot be issued and a redirect no browser will follow.
redirect_hosts = ["example.org", "www.example.org"]

# Three registrable names, one per content class. They must be three distinct
# names: sharing one would put a notebook and a report under one policy, which
# is the whole reason there are three.
#
# `artifacts` and `compute` are **base** names: a user's pages are served from
# `<handle>.<base>`, so alice's report is at alice.artifacts.example.org. That
# is not decoration — origin is the only isolation a browser enforces, and a
# path prefix would give a namespace and no separation at all. Pick names that
# read well with a handle in front of them.
#
# The gate is shared and has no handle: it serves the API and server-rendered
# forms, which execute nothing.
[origins]
gate      = "gate.example.org"       # the API, and later the forms
artifacts = "artifacts.example.org"  # reports — nothing executes
compute   = "compute.example.org"    # notebooks — `wasm-unsafe-eval` lives here

[listen]
https = "0.0.0.0:443"
# **Required whenever [tls] is set**, and the server refuses to start without
# it. Certificates are issued over HTTP-01, so this port answers
# `/.well-known/acme-challenge/{token}` as well as the redirect people typing a
# bare hostname need. A box with TLS and no port 80 would serve whatever it had
# cached and never renew, which is why this is a refusal and not a warning.
http = "0.0.0.0:80"

# Remove this block to serve plain HTTP on loopback (which is all it will let
# you do: a public address without TLS is refused at startup).
#
# One certificate covers the three base names; each active user gets their own,
# covering their artifacts and compute hostnames. The set is reconciled against
# the ledger every thirty seconds, so a user created while the server is running
# gets a certificate **without a restart** — which is what makes signup
# something a second person can do without an operator.
[tls]
contact = "mailto:you@example.org"
# Start here. These certificates are trusted by nobody and rate-limited by
# almost nothing, which is how you find out the ACME path works without
# spending a week's issuance budget discovering that it does not.
staging = true

[limits]
# Generous, because a vendored Pyodide tree is tens of megabytes — but a
# number, because this endpoint is the one place a held key can fill the disk.
max_bundle_bytes = 268435456
max_bundle_files = 20000
# Unauthenticated requests per minute per address. Static reads get ten times
# this, since one notebook page is fifty files.
rate_per_minute = 120
drain_batch = 100
