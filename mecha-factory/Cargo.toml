[package]
name = "mecha-factory"
description = "The public surface: one static binary serving three origins, holding published bytes and a queue of typed requests. Runs on a box we assume is lost."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mecha_factory"
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

# Everything here runs on the public box, so the tree is worth reading. What is
# absent is as deliberate as what is present: no template engine (the server
# renders nothing it was not handed), no HTTP client (it never initiates), and
# nothing from mecha except the manifest — which is the credential-isolation
# claim, checkable by reading this list.
[dependencies]
mecha-manifest = { path = "../mecha-manifest", version = "0.1.0" }
anyhow.workspace = true
axum = "0.8"
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The queue and the bundle ledger. `bundled` so the box needs no system SQLite
# and an upgrade cannot change the engine underneath the data.
rusqlite = { version = "0.37", features = ["bundled"] }
# Keys are stored as hashes, never as bytes that could be replayed if the box
# is read.
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
# Verification tokens are stored as hashes, never as links.
sha2.workspace = true
# A bundle arrives as one archive. Both are pure Rust.
tar = "0.4"
flate2 = "1"

# The certificate, obtained by the binary itself — no proxy terminating TLS.
# `ring` rather than the default `aws-lc-rs`, so building the box's binary
# needs no cmake and no C toolchain.
rustls-acme = { version = "0.15", default-features = false, features = [
    "ring",
    "tls12",
    "webpki-roots",
    "axum",
    "tokio",
] }
axum-server = "0.8"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
