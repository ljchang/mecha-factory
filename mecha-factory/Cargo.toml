[package]
name = "mecha-factory"
description = "The public surface: one static binary serving three origins, holding published bytes and a queue of typed requests. Runs on a box we assume is lost."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mecha_factory"
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

# Everything here runs on the public box, so the tree is worth reading. What is
# absent is as deliberate as what is present: no template engine (the server
# renders nothing it was not handed), and nothing from mecha except the
# manifest — which is the credential-isolation claim, checkable by reading this
# list.
#
# This list used to say "no HTTP client (it never initiates)". That stopped
# being true when the box started sending verification links, and it had to:
# §3 puts `submitted → verified` and the "templated, immediate" decline on the
# origin, and immediate rules out waiting for home to drain a queue and send on
# its behalf. So the box now initiates exactly one kind of outbound call — SES,
# from `mail.rs`, over `ureq`. The claim that matters is unchanged and is worth
# stating in its stronger form: **the box holds no credential that reaches
# home.** An SES key can send mail as the domain and can do nothing else.
[dependencies]
mecha-manifest = { path = "../mecha-manifest", version = "0.1.0" }
anyhow.workspace = true
# `multipart` for the one route that takes a file — the post-verification
# upload page. A hand-rolled multipart parser on an unauthenticated endpoint
# is the opposite of this list's temperament; `multer` underneath is the
# boring, fuzzed option.
axum = { version = "0.8", features = ["multipart"] }
# `statvfs`, for refusing uploads when the disk is nearly full. The one libc
# call in the crate; a crash-safe refusal beats a full disk taking down the
# ledger beside it.
libc = "0.2"
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The queue and the bundle ledger. `bundled` so the box needs no system SQLite
# and an upgrade cannot change the engine underneath the data.
rusqlite = { version = "0.37", features = ["bundled"] }
# Keys are stored as hashes, never as bytes that could be replayed if the box
# is read.
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
# Verification tokens are stored as hashes, never as links.
sha2.workspace = true
# SES is signed with SigV4, which is an HMAC chain over `sha2`. Pure Rust and
# no C toolchain, like `ring` for ACME — and the reason `aws-sdk-sesv2` is not
# here, since it would bring a second HTTP stack alongside `ureq`.
hmac = "0.12"
ureq.workspace = true
# A bundle arrives as one archive. Both are pure Rust.
tar = "0.4"
flate2 = "1"

# The certificate, obtained by the binary itself — no proxy terminating TLS.
# `ring` rather than the default `aws-lc-rs`, so building the box's binary
# needs no cmake and no C toolchain.
#
# The `axum` feature is gone with the acceptor it provided. `AcmeAcceptor` is
# `pub(crate)` and takes the library's concrete resolver, so it cannot be handed
# the SNI-dispatching wrapper that serves one certificate per user — which is
# why issuance moved to HTTP-01, where both halves are public API. See
# `src/certificates.rs`.
rustls-acme = { version = "0.15", default-features = false, features = [
    "ring",
    "tls12",
    "webpki-roots",
    "tokio",
] }
# The TLS layer is ours now: our own `ServerConfig` over our own resolver,
# accepted by `axum-server` rather than by anything from `rustls-acme`.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# Named rather than inherited. `rustls` arrives anyway underneath `rustls-acme`,
# but `certificates.rs` calls `crypto::ring::default_provider()` directly, and a
# feature we depend on has to be one we asked for — otherwise a dependency bump
# that stops enabling `ring` breaks the build somewhere that never mentions it.
# `default-features = false` keeps `aws-lc-rs` out, for the toolchain reason
# above.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
