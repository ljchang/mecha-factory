# Build the box's binary so the box never has to.
#
# Each deploy was a five-minute `cargo build --release` on the droplet's one
# vCPU — and a Rust toolchain resident on a machine whose premise is one static
# binary and a SQLite file. This workflow moves the build here: a tag push
# produces a `factory` binary as a release asset, and the deploy becomes a
# download, a checksum, and a restart (docs/DEPLOY.md).
#
# Static musl rather than the runner's glibc, for the reason mecha's benchmark
# harness learned the hard way: a binary built against the runner's libc
# refuses to start on any box whose glibc is older ("version `GLIBC_2.39' not
# found"), and the failure arrives at the worst time — during an incident, on
# the machine being patched. rustls is the TLS backend throughout, so nothing
# needs a system library. One caveat travels with static musl: no glibc NSS,
# so hostname lookups use musl's own resolver — fine for this binary, which
# dials out only to ACME and SES over ordinary DNS.
name: release

on:
  push:
    tags: ["v*"]
  # A binary without a release, for trying the artifact before tagging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

permissions:
  contents: write

jobs:
  binary:
    runs-on: ubuntu-latest
    env:
      # Static is the contract, so it is stated rather than inherited: the
      # musl target's crt-static default is toolchain policy that can move
      # under us — and the first verified run of this workflow (v0.1.0)
      # proved it had, producing a dynamically linked binary the guard
      # below refused. Scoped to this job, not the workflow: the crates
      # job's `cargo publish` verifies on the gnu host, where crt-static
      # cannot build proc-macros — which the first run of that job (v0.2.0)
      # proved by failing on serde_derive.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl
      # `ring` compiles C for the musl target; musl-gcc is what it links with.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target "$TARGET" -p mecha-factory --bin factory

      # Assert what this workflow exists to guarantee, rather than trusting
      # the build: a dynamically linked binary here is the exact failure that
      # stays invisible until the box refuses to start it.
      - name: Refuse a dynamic binary
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/factory"
          file "$BIN"
          file "$BIN" | grep -Eq "statically linked|static-pie linked" || {
            echo "refusing: $BIN is not statically linked" >&2; exit 1; }
          "$BIN" --help >/dev/null

      - name: Package with checksum
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          tar czf factory-x86_64-linux-musl.tar.gz factory
          sha256sum factory-x86_64-linux-musl.tar.gz > factory-x86_64-linux-musl.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-x86_64-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/factory-x86_64-linux-musl.tar.gz
            target/x86_64-unknown-linux-musl/release/factory-x86_64-linux-musl.tar.gz.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/factory-x86_64-linux-musl.tar.gz
            target/x86_64-unknown-linux-musl/release/factory-x86_64-linux-musl.tar.gz.sha256

  # The same tag publishes the crates, so the binary on the box and the
  # crates on crates.io can never name different code. Trusted Publishing
  # (GitHub OIDC → a 30-minute token) instead of a long-lived API token in
  # the secrets of a public repository; the one-time setup per crate is in
  # CONTRIBUTING.md. Gated on the binary job: a tag whose build fails
  # publishes nothing anywhere.
  crates:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A tag that does not match the workspace version would publish a
      # crate whose version disagrees with its own git tag forever.
      - name: The tag must be the workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [[ "$TAG" == "$VERSION" ]] || {
            echo "tag v$TAG != workspace version $VERSION" >&2; exit 1; }

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order, and "already uploaded" is success rather than
      # failure: re-running a tag's workflow must be idempotent, and the
      # first release is published by hand (Trusted Publishing can only be
      # configured on a crate that exists).
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in mecha-manifest mecha-factory mecha-factory-publish; do
            echo "== $crate"
            if out=$(cargo publish -p "$crate" 2>&1); then
              echo "$out"
            else
              echo "$out"
              echo "$out" | grep -Eq "already uploaded|already exists" || exit 1
              echo "== $crate: this version is already on crates.io; fine"
            fi
          done
