name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so lint debt cannot accumulate silently.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this arm in step with `rust-version` in the workspace manifest.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  # The example is the "renders to a file you can open" check. A form generator
  # whose output has never been produced end to end is a form generator with a
  # bug in it, so CI produces it — and asserts the one property the publish gate
  # will later enforce: no external references in anything we emit.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render every starter
        run: |
          set -euo pipefail
          for manifest in mecha-manifest/types/*.toml; do
            name=$(basename "$manifest" .toml)
            cargo run -q --example render -- "$manifest" "out/$name"
          done
      # The same gate a publish runs, not a grep that approximates it. A grep
      # cannot tell a link a reader clicks from a resource the page fetches, and
      # a second implementation of a security check is a second thing to get
      # wrong.
      - name: Refuse an external reference
        run: |
          set -euo pipefail
          for dir in out/*/; do
            cargo run -q --bin factory-publish -- check "$dir"
          done

      # `gallery/` is committed, and it is a golden file for the renderer.
      # Regenerating it here and refusing a diff is what stops the docs site
      # from showing forms that no longer look like the ones we serve — and a
      # change to `form.rs` or a theme arriving as a reviewable diff of the
      # rendered HTML is the review you want on a form generator anyway.
      - name: Regenerate the gallery
        run: cargo run -q --example gallery -- gallery
      # `git status --porcelain`, not `git diff`: a diff is blind to an
      # untracked file, and the change most likely to add one is a new theme —
      # exactly the case where the docs site would otherwise never learn the
      # palette exists.
      - name: The committed gallery is current
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- gallery)
          if [ -n "$changed" ]; then
            echo "::error::gallery/ is stale. Run: cargo run --example gallery -- gallery"
            echo "$changed"
            exit 1
          fi
      # The whole tree, subdirectories and all: a gallery page is embedded in
      # an <iframe> on the documentation site, so an external reference here
      # would be one on a page we publish.
      - name: The gallery is self-contained
        run: cargo run -q --bin factory-publish -- check gallery
